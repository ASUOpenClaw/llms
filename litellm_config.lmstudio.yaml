model_list:
    # ── Chat — llmster (headless LM Studio daemon) ────────────────────────────
    # model: matches LMS_IDENTIFIER — stable regardless of which GGUF is loaded
    - model_name: qwen3
      litellm_params:
          model: openai/qwen3
          api_base: http://host.docker.internal:1234/v1
          api_key: os.environ/BACKEND_API_KEY
          extra_body:
              think: true
      model_info:
          mode: chat

    # ── Embeddings — Qwen3-Embedding-4B (CPU, custom FastAPI server) ───────
    - model_name: text-embedding-qwen3
      litellm_params:
          model: openai/text-embedding-3-large
          api_base: http://embedding:8001/v1
          api_key: os.environ/BACKEND_API_KEY
      model_info:
          mode: embedding

    # ── STT — Whisper via Speaches ─────────────────────────────────────────
    - model_name: whisper
      litellm_params:
          model: openai/whisper-1
          api_base: http://speaches:8000/v1
          api_key: none
      model_info:
          mode: audio_transcription

    # ── TTS — Kokoro via Speaches ──────────────────────────────────────────
    - model_name: tts
      litellm_params:
          model: openai/speaches-ai/Kokoro-82M-v1.0-ONNX
          api_base: http://speaches:8000
          api_key: none
      model_info:
          mode: audio_speech

general_settings:
    master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
    drop_params: true
    request_timeout: 600
