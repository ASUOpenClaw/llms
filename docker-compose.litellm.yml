services:
    postgres:
        image: postgres:16-alpine
        container_name: litellm-postgres
        restart: unless-stopped
        environment:
            - POSTGRES_USER=${POSTGRES_USER:-litellm}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
            - POSTGRES_DB=${POSTGRES_DB:-litellm}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER:-litellm} -d ${POSTGRES_DB:-litellm}",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 20s

    litellm:
        image: ghcr.io/berriai/litellm:main-latest
        container_name: litellm
        restart: unless-stopped
        volumes:
            - ${LITELLM_CONFIG:-./litellm_config.lmdeploy.yaml}:/app/config.yaml:ro
        ports:
            - "4000:4000"
        command: ["--config", "/app/config.yaml", "--port", "4000"]
        environment:
            - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY is required}
            - LITELLM_SALT_KEY=${LITELLM_SALT_KEY:?LITELLM_SALT_KEY is required}
            - DATABASE_URL=postgresql://${POSTGRES_USER:-litellm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-litellm}
            - BACKEND_API_KEY=${BACKEND_API_KEY}

            - UI_USERNAME=${UI_USERNAME:-admin}
            - UI_PASSWORD=${UI_PASSWORD:?UI_PASSWORD is required}
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - default
            - openclaw-net
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    'python3 -c "import urllib.request; urllib.request.urlopen(''http://localhost:4000/health/liveliness'')" 2>/dev/null || exit 1',
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s

volumes:
    postgres_data:
        driver: local

networks:
    openclaw-net:
        external: true
