model_list:
    # ── Gemma4 31B cloud via Ollama on GPU server ──────────────────────────
    - model_name: gemma4:31b-cloud
      litellm_params:
          model: ollama/gemma4:31b-cloud
          api_base: http://158.160.62.230:11434
      model_info:
          mode: chat

    # ── Qwen3.5 cloud via Ollama on GPU server ─────────────────────────────
    - model_name: qwen3.5:cloud
      litellm_params:
          model: ollama/qwen3.5:cloud
          api_base: http://158.160.62.230:11434
      model_info:
          mode: chat

    # ── Qwen3.5 9B (local) via Ollama on GPU server ───────────────────────
    - model_name: qwen3.5-9b
      litellm_params:
          model: ollama/qwen3.5:9b
          api_base: http://158.160.62.230:11434
      model_info:
          mode: chat

    # ── GLM-5.1 cloud via Ollama on GPU server ─────────────────────────────
    - model_name: glm-5.1:cloud
      litellm_params:
          model: ollama/glm-5.1:cloud
          api_base: http://158.160.62.230:11434
      model_info:
          mode: chat

    # ── Text embeddings via Ollama (Qwen3-Embedding-0.6B, dense, 1024-dim) ─
    # Used by GoClaw memory system and RAG (parser + rag service).
    # MTEB rank #4, same family as Qwen LLMs. Pulled by ollama-pull-embedding.
    # - model_name: text-embedding-qwen3
    #   litellm_params:
    #       model: ollama/qwen3-embedding:0.6b
    #       api_base: http://158.160.62.230:11434
    #   model_info:
    #       mode: embedding

    - model_name: text-embedding-qwen3
      litellm_params:
          model: ollama/qwen3-embedding:4b
          api_base: http://158.160.62.230:11434
      model_info:
          mode: embedding

    - model_name: nomic-embed-text
      litellm_params:
          model: ollama/nomic-embed-text:v1.5
          api_base: http://158.160.62.230:11434
      model_info:
          mode: embedding

    # ── Whisper via Speaches on GPU server (STT) ───────────────────────────
    - model_name: whisper
      litellm_params:
          model: openai/whisper-1
          api_base: http://158.160.62.230:8014/v1
          api_key: none
      model_info:
          mode: audio_transcription

    # ── Kokoro TTS via Speaches ────────────────────────────────────────────
    - model_name: tts
      litellm_params:
          model: openai/speaches-ai/Kokoro-82M-v1.0-ONNX
          api_base: http://158.160.62.230:8014
          api_key: none
      model_info:
          mode: audio_speech

general_settings:
    master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
    drop_params: true
    request_timeout: 600
