    # Qwen3-14B via Ollama on GPU server
    - model_name: qwen3-14b
      litellm_params:
          model: ollama/qwen3:14b
          api_base: http://158.160.62.230:11434
          extra_body:
              think: true
      model_info:
          mode: chat

    # Whisper turbo via Speaches on GPU server
    - model_name: whisper
      litellm_params:
          model: openai/whisper-1
          api_base: http://158.160.62.230:8014/v1
          api_key: none
      model_info:
          mode: audio_transcription

general_settings:
    master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
    drop_params: true
    request_timeout: 600
