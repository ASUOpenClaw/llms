model_list:
    # ── Qwen3-8B (local) via vLLM ─────────────────────────────────────────
    - model_name: qwen3.5-9b
      litellm_params:
          model: openai/Qwen/Qwen3-8B-AWQ
          api_base: http://158.160.62.230:8000/v1
          api_key: os.environ/BACKEND_API_KEY
      model_info:
          mode: chat

    # ── Text embeddings — Qwen3-Embedding-4B (custom CPU server, 2560-dim) ─
    - model_name: text-embedding-qwen3
      litellm_params:
          model: openai/text-embedding-3-large
          api_base: http://158.160.62.230:8001/v1
          api_key: os.environ/BACKEND_API_KEY
      model_info:
          mode: embedding

    # ── Whisper via Speaches on GPU server (STT) ───────────────────────────
    - model_name: whisper
      litellm_params:
          model: openai/whisper-1
          api_base: http://158.160.62.230:8014/v1
          api_key: none
      model_info:
          mode: audio_transcription

    # ── Kokoro TTS via Speaches ────────────────────────────────────────────
    - model_name: tts
      litellm_params:
          model: openai/speaches-ai/Kokoro-82M-v1.0-ONNX
          api_base: http://158.160.62.230:8014
          api_key: none
      model_info:
          mode: audio_speech

general_settings:
    master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
    drop_params: true
    request_timeout: 600
