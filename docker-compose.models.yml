services:
    # ─────────────────────────────────────────────
    # vLLM — Qwen3-8B-AWQ (chat + tool calls)
    # ─────────────────────────────────────────────
    vllm:
        image: vllm/vllm-openai:latest
        container_name: vllm
        restart: unless-stopped
        environment:
            - HF_TOKEN=${HF_TOKEN:-}
        volumes:
            - vllm_hf_cache:/root/.cache/huggingface
        ports:
            - "8000:8000"
        command: >
            --model Qwen/Qwen3-8B-AWQ
            --port 8000
            --quantization awq_marlin
            --dtype float16
            --max-model-len 32768
            --trust-remote-code
            --enable-auto-tool-choice
            --tool-call-parser hermes
            --api-key ${BACKEND_API_KEY}
        #             --gpu-memory-utilization 0.90
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          capabilities: [gpu]
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 120s

    # ─────────────────────────────────────────────
    # embedding — Qwen3-Embedding-4B (CPU, custom FastAPI server)
    # ─────────────────────────────────────────────
    embedding:
        build:
            context: .
            dockerfile: Dockerfile.embedding
        container_name: embedding
        restart: unless-stopped
        environment:
            - HF_TOKEN=${HF_TOKEN:-}
            - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
            - MODEL_ID=Qwen/Qwen3-Embedding-4B
            - API_KEY=${BACKEND_API_KEY}
        volumes:
            - embedding_cache:/root/.cache/huggingface
        ports:
            - "8001:8001"
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 120s

    # ─────────────────────────────────────────────
    # Speaches — Whisper turbo
    # ─────────────────────────────────────────────
    speaches:
        image: ghcr.io/speaches-ai/speaches:latest-cpu # latest-cuda
        container_name: speaches
        restart: unless-stopped
        environment:
            - WHISPER__TTL=-1
            # - WHISPER__INFERENCE_DEVICE=cuda
            # - WHISPER__COMPUTE_TYPE=float16
        volumes:
            - speaches_hf_cache:/home/ubuntu/.cache/huggingface/hub
        ports:
            - "8014:8000"
        # deploy:
        #     resources:
        #         reservations:
        #             devices:
        #                 - driver: nvidia
        #                   capabilities: [gpu]
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s

    # Pull Whisper (STT) and Kokoro (TTS) models on first start
    speaches-pull:
        image: ghcr.io/speaches-ai/speaches:latest-cpu
        container_name: speaches-pull
        restart: no
        entrypoint:
            - /bin/sh
            - -c
            - |
                echo "Pulling deepdml/faster-whisper-large-v3-turbo-ct2..." && \
                curl -sf -X POST "http://speaches:8000/v1/models/deepdml%2Ffaster-whisper-large-v3-turbo-ct2" && \
                echo "Pulling Systran/faster-whisper-large-v3..." && \
                curl -sf -X POST "http://speaches:8000/v1/models/Systran%2Ffaster-whisper-large-v3" && \
                echo "Pulling ytrbqrkflbvbhy/whisper-podlodka-turbo-ct2-float16..." && \
                curl -sf -X POST "http://speaches:8000/v1/models/ytrbqrkflbvbhy%2Fwhisper-podlodka-turbo-ct2-float16" && \
                echo "Pulling speaches-ai/Kokoro-82M-v1.0-ONNX (TTS)..." && \
                curl -sf -X POST "http://speaches:8000/v1/models/speaches-ai%2FKokoro-82M-v1.0-ONNX" && \
                echo "All models pulled successfully."
        depends_on:
            speaches:
                condition: service_healthy

volumes:
    vllm_hf_cache:
        driver: local
    embedding_cache:
        driver: local
    speaches_hf_cache:
        driver: local
