    #         start_period: 120s

    # ─────────────────────────────────────────────
    # Ollama — Qwen3.5-9B (temporary, replaces vLLM)
    # ─────────────────────────────────────────────
    ollama:
        image: ollama/ollama:latest
        container_name: ollama
        restart: unless-stopped
        environment:
            - OLLAMA_KEEP_ALIVE=-1 # keep model in VRAM permanently
            - OLLAMA_GPU_MEMORY_FRACTION=0.55 # leave room for Speaches
            - OLLAMA_FLASH_ATTENTION=1 # halves KV-cache VRAM; required at 32k with Speaches co-resident
        volumes:
            - ollama_data:/root/.ollama
        ports:
            - "11434:11434"
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          capabilities: [gpu]
        healthcheck:
            # ollama CLI is in the image; curl/wget are not
            test: ["CMD", "ollama", "list"]
            interval: 30s
            timeout: 10s
            retries: 10
            start_period: 30s

    # Pull Qwen3-14B and patch its default context to 32k via Modelfile
    ollama-pull:
        image: ollama/ollama:latest
        container_name: ollama-pull
        restart: no
        entrypoint:
            - /bin/sh
            - -c
            - |
                ollama pull qwen3.5:9b
                printf 'FROM qwen3.5:9b\nPARAMETER num_ctx 32768\n' > /tmp/Modelfile
                ollama create qwen3.5:9b -f /tmp/Modelfile
        environment:
            - OLLAMA_HOST=http://ollama:11434
        depends_on:
            ollama:
                condition: service_healthy

    # Pull Qwen3-Embedding-4B on first start (1024-dim dense embeddings)
    ollama-pull-embedding:
        image: ollama/ollama:latest
        container_name: ollama-pull-embedding
        restart: no
        entrypoint: ["/bin/sh", "-c", "ollama pull qwen3-embedding:4b"]
        environment:
            - OLLAMA_HOST=http://ollama:11434
        depends_on:
            ollama:
                condition: service_healthy

    # ─────────────────────────────────────────────
    # Speaches — Whisper turbo
    # ─────────────────────────────────────────────
    speaches:
        image: ghcr.io/speaches-ai/speaches:latest-cpu # latest-cuda
        container_name: speaches
        restart: unless-stopped
        environment:
            - WHISPER__TTL=-1
            # - WHISPER__INFERENCE_DEVICE=cuda
            # - WHISPER__COMPUTE_TYPE=float16
        volumes:
            - speaches_hf_cache:/home/ubuntu/.cache/huggingface/hub
        ports:
            - "8014:8000"
        # deploy:
        #     resources:
        #         reservations:
        #             devices:
        #                 - driver: nvidia
        #                   capabilities: [gpu]
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s

    # Pull Whisper (STT) and Kokoro (TTS) models on first start
    speaches-pull:
        image: ghcr.io/speaches-ai/speaches:latest-cpu
        container_name: speaches-pull
        restart: no
        entrypoint:
            - /bin/sh
            - -c
            - |
                echo "Pulling deepdml/faster-whisper-large-v3-turbo-ct2..." && \
                curl -sf -X POST "http://speaches:8000/v1/models/deepdml%2Ffaster-whisper-large-v3-turbo-ct2" && \
                echo "Pulling Systran/faster-whisper-large-v3..." && \
                curl -sf -X POST "http://speaches:8000/v1/models/Systran%2Ffaster-whisper-large-v3" && \
                echo "Pulling ytrbqrkflbvbhy/whisper-podlodka-turbo-ct2-float16..." && \
                curl -sf -X POST "http://speaches:8000/v1/models/ytrbqrkflbvbhy%2Fwhisper-podlodka-turbo-ct2-float16" && \
                echo "Pulling speaches-ai/Kokoro-82M-v1.0-ONNX (TTS)..." && \
                curl -sf -X POST "http://speaches:8000/v1/models/speaches-ai%2FKokoro-82M-v1.0-ONNX" && \
                echo "All models pulled successfully."
        depends_on:
            speaches:
                condition: service_healthy

volumes:
    # vllm_hf_cache:
    #     driver: local
    ollama_data:
        driver: local
    speaches_hf_cache:
        driver: local
