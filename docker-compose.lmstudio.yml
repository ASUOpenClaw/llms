services:
    lmstudio:
        image: ghcr.io/lucathehacker/lmstudio-container:latest
        container_name: lmstudio
        restart: unless-stopped
        entrypoint: ["/usr/bin/tini", "--", "/lmstudio-entrypoint.sh"]
        volumes:
            - lmstudio_data:/data
            - ./lmstudio-entrypoint.sh:/lmstudio-entrypoint.sh:ro
        environment:
            - LMS_PORT=1234
            - LMS_SERVER_HOST=0.0.0.0
            # Model to download on first boot (HuggingFace path, @Q4_K_M to pin quantization)
            - LMS_PREFETCH=${LMS_PREFETCH:-}
            # Model key to load into memory (from lms ls)
            - LMS_LOAD=${LMS_LOAD:-}
            # Load parameters
            - LMS_CONTEXT_LENGTH=${LMS_CONTEXT_LENGTH:-}
            - LMS_GPU=${LMS_GPU:-max}
            # API identifier — used as model name in /v1/models and litellm config
            - LMS_IDENTIFIER=${LMS_IDENTIFIER:-}
        networks:
            - openclaw-net
        # Uncomment to enable NVIDIA GPU (requires NVIDIA Container Toolkit on host)
        # deploy:
        #     resources:
        #         reservations:
        #             devices:
        #                 - driver: nvidia
        #                   count: all
        #                   capabilities: [gpu]

volumes:
    lmstudio_data:
        driver: local

networks:
    openclaw-net:
        external: true
