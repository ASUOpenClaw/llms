services:
    ollama:
        image: ollama/ollama:latest
        container_name: ollama
        restart: unless-stopped
        environment:
            - OLLAMA_API_KEY=${BACKEND_API_KEY}
            - OLLAMA_KV_CACHE_TYPE=q8_0
            - OLLAMA_KEEP_ALIVE=-1
        volumes:
            - ollama_data:/root/.ollama
        networks:
            - openclaw-net
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          capabilities: [gpu]
        healthcheck:
            test: ["CMD", "ollama", "list"]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 30s

    ollama-init:
        image: ollama/ollama:latest
        container_name: ollama-init
        restart: no
        environment:
            - OLLAMA_HOST=http://ollama:11434
        entrypoint:
            - /bin/sh
            - -c
            - |
                echo "Pulling qwen3.5:9b..." && \
                ollama pull qwen3.5:9b && \
                printf 'FROM qwen3.5:9b\nPARAMETER num_ctx 131072\nPARAMETER num_gpu 99\n' > /tmp/Modelfile && \
                ollama create qwen3 -f /tmp/Modelfile && \
                echo "Done."

        depends_on:
            ollama:
                condition: service_healthy
        networks:
            - openclaw-net

volumes:
    ollama_data:
        driver: local

networks:
    openclaw-net:
        external: true
