services:
    # ─────────────────────────────────────────────────────────────────────────
    # docling-serve — document parsing & OCR
    # Handles PDF (layout + scanned), DOCX, XLSX, images.
    # GPU accelerates OCR and layout models significantly.
    # API: POST /v1alpha/convert/source  →  markdown output
    # ─────────────────────────────────────────────────────────────────────────
    docling:
        image: ghcr.io/docling-project/docling-serve-cu130:main
        container_name: docling
        restart: unless-stopped
        ports:
            - "5001:5001"
        environment:
            - DOCLING_SERVE_ENABLE_UI=true
            - DOCLING_SERVE_API_KEY=${BACKEND_API_KEY}
        volumes:
            - docling_cache:/root/.cache
        healthcheck:
            test: ["CMD", "curl", "-sf", "http://localhost:5001/health"]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 180s

volumes:
    docling_cache:
        driver: local
