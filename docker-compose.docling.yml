services:
    docling:
        # GPU version (cu130, requires SM75+): ghcr.io/docling-project/docling-serve-cu130:main
        image: ghcr.io/docling-project/docling-serve:main
        container_name: docling
        restart: unless-stopped
        ports:
            - "5001:5001"
        environment:
            - DOCLING_SERVE_ENABLE_UI=true
            - DOCLING_SERVE_API_KEY=${BACKEND_API_KEY}
        volumes:
            - docling_cache:/root/.cache
        networks:
            - openclaw-net
        healthcheck:
            test: ["CMD", "curl", "-sf", "http://localhost:5001/health"]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 180s

volumes:
    docling_cache:
        driver: local

networks:
    openclaw-net:
        external: true
